name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: show toolchain
        run: |
          rustc --version
          cargo --version
          cc --version

      - name: build
        run: cargo build --workspace --all-targets

      - name: test
        run: cargo test --workspace

      - name: upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: gtps-server-linux-x86_64
          path: target/debug/gtps-server
          if-no-files-found: error

  fmt:
    name: rustfmt (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: check formatting
        run: cargo fmt --all -- --check

      - name: export formatting patch
        if: failure()
        run: |
          cargo fmt --all
          git diff > formatting.patch

      - name: upload formatting patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: formatting.patch

  clippy:
    name: clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  arm64:
    name: ARM64 static server
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build static server
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target aarch64-unknown-linux-musl -p gtps-server
      - uses: actions/upload-artifact@v4
        with:
          name: gtps-server-linux-aarch64
          path: target/aarch64-unknown-linux-musl/release/gtps-server
