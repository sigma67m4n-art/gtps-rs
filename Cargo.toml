[workspace]
resolver = "2"
members = [
    "crates/gtps-enet",
    "crates/gtps-proto",
    "crates/gtps-world",
    "crates/gtps-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
gtps-enet = { path = "crates/gtps-enet" }
gtps-proto = { path = "crates/gtps-proto" }
gtps-world = { path = "crates/gtps-world" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
